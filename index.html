<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FxSound Mobile</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css?v=99" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a22'/%3E%3Cpath d='M16 44V20l16 12 16-12v24' fill='none' stroke='%237c5cff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 64 64" width="28" height="28">
            <path d="M16 44V20l16 12 16-12v24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>FxSound</h1>
          <span class="brand-sub" data-i18n="brand.subtitle">Mobile Audio Enhancer</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="langBtn" class="icon-btn" aria-label="Language">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span id="langBadge" class="lang-badge">EN</span>
        </button>
        <button id="powerBtn" class="power-btn" aria-label="Power">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Language popover -->
    <div id="langPopover" class="lang-popover">
      <div class="lang-popover-title" data-i18n="lang.label">Language</div>
      <div id="langOptions" class="lang-options"></div>
    </div>

    <!-- Now Playing / System Audio Status -->
    <section class="now-playing">
      <div class="track-art" id="trackArt">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        </svg>
      </div>
      <div class="track-info">
        <div class="track-title" id="trackTitle" data-i18n="track.noTrack">System Audio</div>
        <div class="track-artist" id="trackArtist" data-i18n="track.loadHint">Tap power to capture all device audio</div>
      </div>
      <div class="capture-indicator" id="captureIndicator">
        <span class="pulse-dot"></span>
      </div>
    </section>

    <!-- Preset selector -->
    <section class="preset-section">
      <div class="section-label" data-i18n="section.preset">Preset</div>
      <div class="preset-scroll" id="presetScroll"></div>
    </section>

    <!-- Tab navigation -->
    <nav class="tabs">
      <button class="tab active" data-tab="effects" data-i18n="tab.effects">Effects</button>
      <button class="tab" data-tab="equalizer" data-i18n="tab.equalizer">Equalizer</button>
      <button class="tab" data-tab="master" data-i18n="tab.master">Master</button>
    </nav>

    <!-- Effects panel -->
    <section class="panel active" id="panel-effects">
      <div id="effectsList" class="effects-list"></div>
    </section>

    <!-- Equalizer panel -->
    <section class="panel" id="panel-equalizer">
      <div class="eq-controls">
        <div class="eq-preset-row">
          <button class="eq-flat-btn" id="eqFlatBtn" data-i18n="eq.flat">Flat</button>
        </div>
      </div>
      <div class="eq-container" id="eqContainer"></div>
      <div class="eq-spectrum" id="eqSpectrum"></div>
    </section>

    <!-- Master panel -->
    <section class="panel" id="panel-master">
      <div id="masterList" class="effects-list"></div>
    </section>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="i18n.js?v=99"></script>
  <script src="presets.js?v=99"></script>
  <script src="app.js?v=99"></script>
</body>
</html>
